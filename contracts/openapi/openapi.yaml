openapi: 3.1.0
info:
  title: yoda
  version: 0.1.0
  description: Source of truth for the HTTP API. Change this file before changing the code.

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate and start a session
      description: On success, sets the `yoda_session` HttpOnly cookie with a signed token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Authenticated. The session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          description: Invalid email or password (code INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session
      description: Clears the session cookie. Succeeds even without a valid session.
      responses:
        "204":
          description: Session cookie cleared.

  /api/v1/users/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: Get the authenticated user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/conversations:
    post:
      tags: [conversations]
      operationId: createConversation
      summary: Create an empty conversation
      description: The title is filled from the first message sent to the conversation.
      security:
        - sessionCookie: []
      responses:
        "201":
          description: Conversation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    get:
      tags: [conversations]
      operationId: listConversations
      summary: List conversations, most recently updated first
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [conversations]
      operationId: getConversation
      summary: Get a conversation
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Conversation found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ConversationNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [conversations]
      operationId: deleteConversation
      summary: Delete a conversation
      description: Soft delete. The conversation stops being listed and returns 404 everywhere.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Conversation deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ConversationNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [conversations]
      operationId: listMessages
      summary: List messages of a conversation
      description: >
        Returns the most recent messages in chronological order. `nextCursor` points to older
        messages; pass it as `cursor` to load the previous page.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ConversationNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: yoda_session

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as `nextCursor` by the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthenticated:
      description: Missing, invalid or expired session (code UNAUTHENTICATED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConversationNotFound:
      description: Conversation not found, deleted or owned by another user (code NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Invalid request (code VALIDATION_ERROR).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024

    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string

    Conversation:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          description: First ~60 characters of the first message; null until a message is sent.
          anyOf:
            - type: string
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConversationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        nextCursor:
          anyOf:
            - type: string
            - type: "null"

    Message:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    MessagePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        nextCursor:
          anyOf:
            - type: string
            - type: "null"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Stable machine-readable error code: VALIDATION_ERROR, NOT_FOUND, UNAUTHENTICATED,
            INVALID_CREDENTIALS.
        message:
          type: string
        details:
          anyOf:
            - {}
            - type: "null"
