openapi: 3.1.0
info:
  title: yoda
  version: 0.1.0
  description: Source of truth for the HTTP API. Change this file before changing the code.

paths:
  /api/v1/examples:
    get:
      tags: [examples]
      operationId: listExamples
      summary: List examples
      responses:
        "200":
          description: Examples found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleList"
    post:
      tags: [examples]
      operationId: createExample
      summary: Create an example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExampleCreate"
      responses:
        "201":
          description: Example created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "422":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/examples/{exampleId}:
    get:
      tags: [examples]
      operationId: getExample
      summary: Get an example by id
      parameters:
        - name: exampleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Example found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "404":
          description: Example not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate and start a session
      description: On success, sets the `yoda_session` HttpOnly cookie with a signed token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Authenticated. The session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          description: Invalid email or password (code INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session
      description: Clears the session cookie. Succeeds even without a valid session.
      responses:
        "204":
          description: Session cookie cleared.

  /api/v1/users/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: Get the authenticated user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: yoda_session

  responses:
    Unauthenticated:
      description: Missing, invalid or expired session (code UNAUTHENTICATED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Invalid request (code VALIDATION_ERROR).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024

    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string

    ExampleCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"

    Example:
      type: object
      required: [id, name, description, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          anyOf:
            - type: string
            - type: "null"
        createdAt:
          type: string
          format: date-time

    ExampleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Example"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >
            Stable machine-readable error code: VALIDATION_ERROR, NOT_FOUND, UNAUTHENTICATED,
            INVALID_CREDENTIALS.
        message:
          type: string
        details:
          anyOf:
            - {}
            - type: "null"
