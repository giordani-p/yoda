openapi: 3.1.0
info:
  title: my-project
  version: 0.1.0
  description: Source of truth for the HTTP API. Change this file before changing the code.

paths:
  /api/v1/examples:
    get:
      tags: [examples]
      operationId: listExamples
      summary: List examples
      responses:
        "200":
          description: Examples found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleList"
    post:
      tags: [examples]
      operationId: createExample
      summary: Create an example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExampleCreate"
      responses:
        "201":
          description: Example created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "422":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/examples/{exampleId}:
    get:
      tags: [examples]
      operationId: getExample
      summary: Get an example by id
      parameters:
        - name: exampleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Example found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "404":
          description: Example not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ExampleCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"

    Example:
      type: object
      required: [id, name, description, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          anyOf:
            - type: string
            - type: "null"
        createdAt:
          type: string
          format: date-time

    ExampleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Example"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code, e.g. NOT_FOUND, VALIDATION_ERROR.
        message:
          type: string
        details:
          anyOf:
            - {}
            - type: "null"
