name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      # setup-uv não publica tag de versão principal (v10); usar a versão completa.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: apps/backend
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      # Inclui o teste de contrato (tests/test_contract.py).
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup não publica tag de versão principal (v6); usar a versão completa.
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: apps/frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Client gerado está atualizado com o contrato
        run: pnpm generate && git diff --exit-code src/services/api/generated
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
