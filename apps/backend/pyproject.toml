[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx2>=2.16.0",
    "import-linter>=2.16",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_package = "app"

# Grafo entre módulos (ADR 0004): por padrão nenhum módulo importa outro. As únicas exceções
# permitidas são as arestas abaixo, e somente para a interface pública (o pacote raiz do
# módulo). Importar um subpacote interno de outro módulo quebra o contrato.
[[tool.importlinter.contracts]]
name = "Modules only depend on the allowed public interfaces"
type = "independence"
modules = ["app.modules.*"]
ignore_imports = [
    "app.modules.assistant.** -> app.modules.context",
    "app.modules.assistant.** -> app.modules.conversations",
    "app.modules.context.** -> app.modules.conversations",
]
unmatched_ignore_imports_alerting = "none"

# Camadas internas de cada módulo (ADR 0002), por arquivo: um arquivo só importa os que estão
# abaixo dele. Os parênteses tornam a camada opcional (módulos ainda vazios não quebram).
[[tool.importlinter.contracts]]
name = "Module layers"
type = "layers"
containers = ["app.modules.*"]
layers = ["(router)", "(service)", "(repository)", "(models)"]

[[tool.importlinter.contracts]]
name = "core and shared do not depend on modules or api"
type = "forbidden"
source_modules = ["app.core", "app.shared"]
forbidden_modules = ["app.modules", "app.api"]
